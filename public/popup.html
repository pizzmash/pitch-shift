<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PitchShift</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header><div class="brand"><span class="logo" aria-hidden="true">♮</span><div><h1>PitchShift<span class="dot">.</span></h1><p>YOUR VOICE. YOUR KEY.</p></div></div><span class="badge">練習モード</span></header>
<section class="track"><span class="play-icon" aria-hidden="true">▶</span><div><span class="eyebrow">YOUTUBE</span><p id="track-title">動画に接続しています…</p></div><span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span></section>
<div id="message" role="status" aria-live="polite">YouTubeの動画を確認しています…</div>
<fieldset id="controls" disabled><legend class="sr-only">カラオケ練習コントロール</legend>
<section class="card pitch"><div class="section-heading"><h2>キー <span>PITCH</span></h2><button class="text-button" id="pitch-zero">原曲に戻す</button></div><div class="stepper"><button class="step" id="pitch-down" aria-label="キーを半音下げる">−</button><div class="reading"><output id="pitch-value">0</output><span>半音</span></div><button class="step accent" id="pitch-up" aria-label="キーを半音上げる">＋</button></div><div class="scale" aria-hidden="true"><span>−12</span><div id="pitch-meter"><i></i></div><span>＋12</span></div><p class="hint">あなたの声に、ちょうどいいキーを。</p></section>
<section class="card"><div class="section-heading"><h2>スピード <span>SPEED</span></h2><span class="mini">音程をキープ</span></div><div class="stepper compact"><button class="step" id="speed-down" aria-label="速度を0.05倍下げる">−</button><div class="reading"><output id="speed-value">1.00</output><span>×</span></div><button class="step" id="speed-up" aria-label="速度を0.05倍上げる">＋</button></div><div class="presets" aria-label="速度プリセット"><button data-speed="0.5">0.5×</button><button data-speed="0.75">0.75×</button><button data-speed="1">1×</button><button data-speed="1.25">1.25×</button></div></section>
<section class="card rewind-card"><div class="section-heading"><h2>もう一度 <span>REPEAT</span></h2><label class="seconds"><input id="seconds" type="number" min="1" max="60" step="1" value="10" aria-label="巻き戻す秒数"> 秒</label></div><button id="rewind" class="rewind"><span aria-hidden="true">↶</span><span id="rewind-label">10秒 巻き戻す</span></button><div class="rewind-presets"><span>巻き戻し幅</span><button data-seconds="5">5秒</button><button data-seconds="10">10秒</button><button data-seconds="30">30秒</button></div></section>
<button id="reset" class="reset">↺ キーとスピードをリセット</button>
</fieldset><footer>好きな曲を、自分のペースで。<span>音声はこの端末内だけで処理</span></footer>
</main><script type="module" src="popup.js"></script></body></html>
